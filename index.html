<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário de Dados da SRE – ANPD</title>
<meta name="description" content="Plano de Dados Abertos da Superintendência de Regulação da ANPD: bases de dados, consultas à sociedade e publicações, com acesso direto aos processos no SEI e aos documentos.">
<style>
/* ============================================================
   ANPD — Inventário de Dados da SRE / Plano de Dados Abertos
   Arquivo único: HTML + CSS + JS, sem dependência externa.

   MODO EMBUTIDO: ?embed=1 na URL (ou class="embed" no <body>)
   oculta a barra gov.br, o cabeçalho e o rodapé, para quando a
   página já estiver dentro do portal.

   PALETA: azul institucional gov.br (#1351B4) como cor de ação;
   as séries usam azul, verde, magenta e roxo — conjunto verificado
   quanto à distinção entre séries, com os rótulos de cada barra
   garantindo a leitura para quem não distingue as cores.
   ============================================================ */

:root{
  --azul:#1351B4;
  --azul-80:#0C326F;
  --azul-escuro:#071D41;
  --azul-claro:#E8EFFE;
  --verde:#168821;
  --magenta:#E5007D;
  --roxo:#7B2D8B;
  --texto:#333333;
  --texto-2:#555555;
  --borda:#E5E7EB;
  --cinza-bg:#FAFAFA;
  --gray-2:#F8F8F8;
  --raio:4px;
  --pilula:100em;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#fff;color:var(--texto);
  font-family:'Rawline','Raleway','Helvetica Neue',Arial,Helvetica,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

/* ---------- barra gov.br ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:8px 24px;font-size:13px;background:#fff;border-bottom:1px solid var(--borda)}
.topbar .esq,.topbar .dir{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .govbr{font-weight:800;font-size:17px;letter-spacing:-.01em;color:var(--azul-80);text-decoration:none}
.topbar .govbr i{font-style:normal;color:var(--verde)}
.topbar .orgao{color:var(--texto-2);font-size:12.5px}
.topbar a{color:var(--azul);text-decoration:none}
.topbar a:hover{text-decoration:underline}
.btn-pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--pilula);
  padding:5px 14px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn-pill.out{border:1px solid var(--azul);color:var(--azul)}
.btn-pill.out:hover{background:var(--azul-claro);text-decoration:none}
.btn-pill.fill{background:var(--azul);color:#fff}
.btn-pill.fill:hover{background:var(--azul-80);text-decoration:none}

/* ---------- marca ---------- */
.header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding:14px 24px;background:#fff;border-bottom:1px solid var(--borda)}
.header .id{display:flex;align-items:center;gap:14px;text-decoration:none;min-width:0}
.header .id img{height:44px;width:auto;flex-shrink:0;display:block}
.header .nome{color:var(--texto);font-size:19px;font-weight:400;line-height:1.2;
  padding-left:14px;border-left:1px solid var(--borda)}
.header nav{display:flex;align-items:center;gap:22px;font-size:14px;flex-wrap:wrap}
.header nav a{color:var(--texto-2);text-decoration:none}
.header nav a:hover{color:var(--azul);text-decoration:underline}
.header nav a.ativo{color:var(--azul);font-weight:600}

.subnav{display:flex;border-bottom:1px solid var(--borda);padding:0 24px;background:#F8F8F8;overflow-x:auto}
.subnav button{padding:10px 16px;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;
  color:var(--texto-2);transition:color .15s,border-color .15s}
.subnav button[aria-current="page"]{border-color:var(--azul);color:var(--azul);font-weight:600}

.breadcrumb{padding:16px 24px 8px;font-size:14px;color:var(--azul)}
.breadcrumb a{text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb .sep{margin:0 6px;color:#9CA3AF}
.breadcrumb .atual{color:#6B7280}

body.embed .topbar,body.embed .header,body.embed .breadcrumb,body.embed .rodape{display:none}
body.embed .page-head,body.embed .painel-head{padding-top:24px}

/* ---------- cabeçalho de página ---------- */
.page-head,.painel-head{padding:0 24px 18px}
.painel-head{border-bottom:1px solid var(--borda)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
.page-head h1,.painel-head h1{margin:0 0 8px;font-size:32px;line-height:1.2;font-weight:300;color:var(--texto)}
.page-head p,.painel-head p{margin:0;max-width:80ch;font-size:14px;color:#4B5563;line-height:1.6}

.viewtoggle{display:flex;border:1px solid var(--borda);border-radius:var(--raio);overflow:hidden;height:38px;margin-top:4px}
.viewtoggle button{padding:8px;color:#888;display:flex;align-items:center;transition:background .15s,color .15s}
.viewtoggle button+button{border-left:1px solid var(--borda)}
.viewtoggle button[aria-pressed="true"]{background:var(--azul-claro);color:var(--azul)}

/* ---------- números ---------- */
.tiles{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;padding:20px 24px 0}
.tile .rot{margin:0;font-size:12px;color:#6B7280;letter-spacing:.06em;text-transform:uppercase}
.tile .num{margin:2px 0 0;font-weight:700;color:var(--texto);line-height:1.05;font-size:26px}
.tile.hero .num{font-size:52px;color:var(--azul)}
.tile .sub{margin:2px 0 0;font-size:12px;color:#6B7280;max-width:26ch}
.tile+.tile{border-left:1px solid var(--borda);padding-left:26px}

.painel-ctrl{padding:20px 24px 0;display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:14px;color:#4B5563}
.painel-ctrl label{display:flex;align-items:center;gap:6px;cursor:pointer}
.painel-ctrl input{accent-color:var(--azul)}

/* ---------- gráficos ---------- */
.secao-titulo{padding:26px 24px 0;font-size:12px;font-weight:700;color:#4B5563;
  letter-spacing:.14em;text-transform:uppercase;margin:0}
.graficos{padding:14px 24px 34px;display:grid;gap:20px;align-items:start;
  grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.grafico{margin:0;min-width:0;border:1px solid var(--borda);border-radius:var(--raio);
  padding:18px 20px 20px;background:#fff}
.grafico.largo{grid-column:1/-1}
.grafico figcaption{margin-bottom:14px}
.grafico h3{margin:0;font-size:15px;font-weight:700;color:var(--texto)}
.grafico .leg{margin:3px 0 0;font-size:12px;color:#6B7280;line-height:1.45}

.legenda{list-style:none;display:flex;flex-wrap:wrap;gap:16px;margin:0 0 14px;padding:0;font-size:12.5px;color:#4B5563}
.legenda li{display:flex;align-items:center;gap:6px}
.legenda .sw{width:10px;height:10px;border-radius:2px;display:block}

.barras{display:flex;flex-direction:column;gap:9px}
.linha-b{display:grid;grid-template-columns:minmax(96px,210px) 1fr auto;align-items:center;gap:12px}
.linha-b .rot{font-size:13px;color:#4B5563;line-height:1.25;overflow-wrap:break-word;word-break:normal}
.linha-b .trilho{height:14px;display:flex;align-items:center}
.linha-b .barra{display:block;height:14px;border-radius:0 4px 4px 0;min-width:2px}
.linha-b .val{font-size:13px;color:#374151;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.linha-b .val i{font-style:normal;font-weight:400;color:#9CA3AF;margin-left:4px}

.colunas{display:flex;align-items:flex-end;gap:12px;height:190px;padding-top:20px;overflow-x:auto}
.coluna{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;flex:1;min-width:44px;height:100%}
.coluna .cap{font-size:12px;color:#374151;font-weight:600;font-variant-numeric:tabular-nums}
.coluna .pilha{width:100%;max-width:26px;display:flex;flex-direction:column-reverse;gap:2px;min-height:2px}
.coluna .pilha span{display:block;min-height:3px}
.coluna .pilha span:last-child{border-radius:4px 4px 0 0}
.coluna .ano{font-size:12px;color:#6B7280;font-variant-numeric:tabular-nums}

.tab-grafico{width:100%;border-collapse:collapse;font-size:13px}
.tab-grafico th{padding:6px 8px;font-size:11px;border-bottom:1px solid var(--borda);
  text-transform:uppercase;letter-spacing:.05em;color:#4B5563;text-align:left}
.tab-grafico td{padding:6px 8px;border-bottom:1px solid #F3F4F6;vertical-align:middle}
.tab-grafico td.n,.tab-grafico th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab-grafico .pt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}

/* ---------- abas e filtros ---------- */
.tipotabs{border-bottom:1px solid var(--borda);padding:0 24px}
.tipotabs .trilho{display:flex;overflow-x:auto}
.tipotabs button{display:flex;align-items:center;gap:6px;padding:12px 16px;font-size:14px;white-space:nowrap;
  border-bottom:2px solid transparent;color:var(--texto-2);flex-shrink:0}
.tipotabs button[aria-selected="true"]{border-color:var(--azul);color:var(--azul);font-weight:600}
.tipotabs .ico{display:flex;color:#AAA}
.tipotabs button[aria-selected="true"] .ico{color:var(--azul)}
.tipotabs .cont{font-size:12px;padding:1px 7px;border-radius:999px;margin-left:2px;font-weight:600;
  background:#E0E0E0;color:#666}
.tipotabs button[aria-selected="true"] .cont{background:var(--azul);color:#fff}

.filtros{padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  border-bottom:1px solid #F3F4F6;background:rgba(249,250,251,.6)}
.busca{position:relative;display:block}
.busca .lupa{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;color:#9CA3AF;pointer-events:none}
.busca input{padding:8px 14px 8px 34px;border:1px solid #D1D5DB;border-radius:var(--raio);
  font-size:14px;width:300px;max-width:100%;background:#fff}
.busca input:focus{outline:2px solid var(--azul);outline-offset:-1px;border-color:var(--azul)}
.grupo{display:flex;align-items:center;gap:6px;font-size:14px;flex-wrap:wrap}
.grupo .rot{color:#6B7280}
.chip{padding:4px 12px;border:1px solid #CCC;border-radius:999px;font-size:14px;background:transparent;
  color:#333;transition:all .15s}
.chip:hover{border-color:#9CA3AF}
.chip[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.limpar{font-size:14px;color:var(--azul);text-decoration:underline}

.resumo{padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.resumo p{margin:0;font-size:14px;color:#374151}
.resumo .dir{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.resumo .data{font-size:12px;color:#9CA3AF}
.btn-csv{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--azul);
  border:1px solid var(--azul);border-radius:var(--pilula);padding:5px 14px;background:#fff}
.btn-csv:hover{background:var(--azul-claro)}

/* ---------- cards ---------- */
.grade{padding:0 24px 40px;display:grid;gap:16px;align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.card{border:1px solid var(--borda);border-radius:var(--raio);padding:18px;background:#fff;
  display:flex;flex-direction:column;gap:11px;transition:box-shadow .15s;border-top:3px solid var(--azul)}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card .tipo{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase}
.card h3{margin:0;font-size:16px;font-weight:700;line-height:1.3;color:var(--texto)}
.card .ementa{margin:0;font-size:13.5px;color:#4B5563;line-height:1.5}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.card dt{color:#6B7280}
.card dd{margin:0;color:#374151;overflow-wrap:break-word}
.card dd a{color:var(--azul);font-weight:600;text-decoration:none}
.card dd a:hover{text-decoration:underline}
.numero{display:flex;align-items:baseline;gap:7px;padding:9px 12px;background:var(--gray-2);border-radius:var(--raio)}
.numero .n{font-size:22px;font-weight:700;color:var(--azul);font-variant-numeric:tabular-nums}
.numero .u{font-size:12.5px;color:#4B5563}
.numero.vazio .n{font-size:14px;color:#6B7280;font-weight:600}
.docs{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:2px}
.doc{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;
  border:1px solid var(--azul);color:var(--azul);border-radius:var(--pilula);padding:4px 12px;text-decoration:none}
.doc:hover{background:var(--azul-claro)}
.doc.sem{border-color:#D1D5DB;color:#6B7280;cursor:default}
.doc.sei{border-color:var(--azul-80);color:var(--azul-80)}
.doc.sei:hover{background:#E7EDF7}
.vazio-lista{padding:40px 24px;color:#6B7280;font-size:14px}

/* ---------- bases de dados ---------- */
.bases{padding:0 24px 40px;display:grid;gap:16px;align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.base{border:1px solid var(--borda);border-left:3px solid var(--azul);border-radius:var(--raio);
  padding:20px;background:#fff;display:flex;flex-direction:column;gap:14px}
.base h3{margin:0;font-size:15.5px;font-weight:700;line-height:1.4;color:var(--texto)}
.atributos{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.atributos div{min-width:0}
.atributos dt{font-size:11px;color:#6B7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
.atributos dd{margin:0;font-size:13.5px;color:var(--texto);font-weight:600}
.atributos dd.sim{color:var(--verde)}
.atributos dd.nao{color:#6B7280}

/* ---------- tabelas ---------- */
.tabela-wrap{margin:0 24px 40px;border:1px solid var(--borda);border-radius:var(--raio);overflow-x:auto}
table.catalogo{width:100%;border-collapse:collapse;font-size:14px;min-width:940px}
table.catalogo thead tr{background:#F3F3F3}
table.catalogo th{text-align:left;padding:12px 16px;font-size:12px;font-weight:700;color:#4B5563;
  text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--borda)}
table.catalogo tbody tr{border-bottom:1px solid #F3F4F6}
table.catalogo tbody tr:nth-child(even){background:var(--cinza-bg)}
table.catalogo tbody tr:hover{background:rgba(219,234,254,.4)}
table.catalogo td{padding:12px 16px;vertical-align:top}
table.catalogo .t1{margin:0;font-weight:600;color:var(--texto);line-height:1.35}
table.catalogo .t2{margin:3px 0 0;font-size:12px;color:#6B7280;line-height:1.45}
table.catalogo a.sei-link{color:var(--azul);font-weight:600;text-decoration:none;white-space:nowrap}
table.catalogo a.sei-link:hover{text-decoration:underline}
.badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:4px;display:inline-block;
  white-space:nowrap;letter-spacing:.03em}

.rodape{padding:28px 24px 34px;background:var(--azul-escuro);color:#fff;font-size:12.5px;margin-top:8px}
.rodape .marca-rod{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rodape .marca-rod img{height:38px;width:auto;display:block;background:#fff;border-radius:var(--raio);padding:5px 8px}
.rodape .marca-rod span{font-size:14px}
.rodape p{margin:0 0 5px;color:rgba(255,255,255,.78);max-width:100ch;line-height:1.55}
.rodape a{color:#fff}

@media (max-width:760px){
  .topbar .dir a:not(.btn-pill){display:none}
  .topbar .btn-pill.out{display:none}
  .header nav{display:none}
  .header .id img{height:38px}
  .header .nome{font-size:16px}
}
@media (max-width:520px){
  .topbar,.header,.subnav,.breadcrumb,.page-head,.painel-head,.tiles,.painel-ctrl,
  .graficos,.secao-titulo,.filtros,.resumo,.tipotabs,.rodape{padding-left:16px;padding-right:16px}
  .grade,.bases{padding-left:16px;padding-right:16px}
  .tabela-wrap{margin-left:16px;margin-right:16px}
  .graficos,.bases{grid-template-columns:1fr}
  .grafico{padding:16px}
  .page-head h1,.painel-head h1{font-size:25px}
  .tiles{gap:16px}
  .tile+.tile{border-left:0;padding-left:0}
  .tile.hero .num{font-size:44px}
  .linha-b{grid-template-columns:minmax(84px,120px) 1fr auto;gap:8px}
  .busca,.busca input{width:100%}
}
</style>
</head>

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function icone(nome, tam){
  tam = tam || 14;
  return '<svg width="'+tam+'" height="'+tam+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="'+ICONES[nome]+'"/></svg>';
}
function lupa(){
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>';
}
function num(n){ return (n == null ? '—' : Number(n).toLocaleString('pt-BR')); }
function pct(n, total){ return total ? Math.round(n / total * 100) : 0; }
function semAcento(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function acha(lista, id){
  for(var i=0;i<lista.length;i++){ if(lista[i].id === id) return lista[i]; }
  return null;
}

/* nº SEI: vira link quando a planilha traz o hyperlink do processo */
function linkSei(sei, url, classe){
  if(!sei) return '';
  if(!url) return esc(sei);
  return '<a class="'+(classe || 'sei-link')+'" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" '+
    'title="Abrir o processo '+esc(sei)+' no SEI">'+esc(sei)+'</a>';
}
function botaoSei(sei, url){
  if(!sei || !url) return '';
  return '<a class="doc sei" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+
    icone('processo',12)+'Processo no SEI</a>';
}
function listaDocs(docs){
  if(!docs.length) return '<span class="doc sem">Sem documento publicado</span>';
  return docs.map(function(d){
    if(d.url){
      return '<a class="doc" href="'+esc(d.url)+'" target="_blank" rel="noopener noreferrer">'+
        icone('link',12)+esc(d.cat)+'</a>';
    }
    return '<span class="doc sem" title="'+esc(d.ref || 'Sem URL na planilha')+'">'+esc(d.cat)+' (sem link)</span>';
  }).join('');
}
function participacao(i){
  if(i.contribuicoes != null) return {n:i.contribuicoes, u:'contribuições recebidas'};
  if(i.contribuintes != null) return {n:i.contribuintes, u:'contribuintes'};
  if(i.espectadores != null || i.oral != null){
    return {n:i.espectadores, u:'espectadores' + (i.oral != null ? ' · ' + i.oral + ' participações orais' : '')};
  }
  return null;
}

/* ---------- filtros ---------- */

function passaInstr(i, ignorarTipo){
  if(!ignorarTipo && state.tipo !== 'todos' && i.tipo !== state.tipo) return false;
  if(state.anos.length && state.anos.indexOf(i.ano) === -1) return false;
  if(state.plataformas.length && state.plataformas.indexOf(i.plataforma) === -1) return false;
  if(state.busca){
    var q = semAcento(state.busca);
    if(semAcento([i.nome,i.ementa,i.sei,i.plataforma,i.parceria,i.periodo].join(' ')).indexOf(q) === -1) return false;
  }
  return true;
}
function passaPub(p, ignorarSecao){
  if(!ignorarSecao && state.secao !== 'todas' && p.secao !== state.secao) return false;
  if(state.pubAnos.length && state.pubAnos.indexOf(p.anoNum) === -1) return false;
  if(state.pubCategorias.length && state.pubCategorias.indexOf(p.categoria) === -1) return false;
  if(state.pubBusca){
    var q = semAcento(state.pubBusca);
    if(semAcento([p.titulo,p.ementa,p.sei,p.categoria,p.vigencia,p.parceria].join(' ')).indexOf(q) === -1) return false;
  }
  return true;
}

function grafBarras(titulo, legenda, itens, total, opcoes){
  opcoes = opcoes || {};
  var corPadrao = opcoes.cor || '#1351B4';
  var max = itens.reduce(function(m,i){ return Math.max(m, i.n); }, 0) || 1;
  var corpo;
  if(state.graficosTabela){
    corpo = '<table class="tab-grafico"><thead><tr><th>'+esc(opcoes.colunaRotulo || 'Item')+'</th>'+
      '<th class="n">'+esc(opcoes.colunaValor || 'Total')+'</th><th class="n">%</th></tr></thead><tbody>'+
      itens.map(function(i){
        return '<tr><td><span class="pt" style="background:'+(i.cor || corPadrao)+'"></span>'+esc(i.k)+'</td>'+
          '<td class="n">'+num(i.n)+'</td><td class="n">'+pct(i.n,total)+'%</td></tr>';
      }).join('')+'</tbody></table>';
  }else{
    corpo = '<div class="barras">'+itens.map(function(i){
      return '<div class="linha-b"><span class="rot">'+esc(i.k)+'</span>'+
        '<span class="trilho"><span class="barra" style="width:'+(i.n/max*100)+'%;background:'+(i.cor || corPadrao)+'"></span></span>'+
        '<span class="val">'+num(i.n)+'<i>'+pct(i.n,total)+'%</i></span></div>';
    }).join('')+'</div>';
  }
  return '<figure class="grafico'+(opcoes.largo ? ' largo' : '')+'"><figcaption><h3>'+esc(titulo)+'</h3>'+
    (legenda ? '<p class="leg">'+esc(legenda)+'</p>' : '')+'</figcaption>'+corpo+'</figure>';
}

/* colunas empilhadas por categoria, com eixo de tempo contínuo */
function grafPorAno(titulo, legendaTxt, anos, series, contar){
  var matriz = anos.map(function(a){
    var linha = {ano:a, total:0, partes:[]};
    series.forEach(function(s){
      var n = contar(a, s.id);
      linha.partes.push({s:s, n:n});
      linha.total += n;
    });
    return linha;
  });
  var max = matriz.reduce(function(m,l){ return Math.max(m, l.total); }, 0) || 1;
  var legenda = '<ul class="legenda">'+series.map(function(s){
    return '<li><span class="sw" style="background:'+s.cor+'"></span>'+esc(s.label)+'</li>';
  }).join('')+'</ul>';

  var corpo;
  if(state.graficosTabela){
    corpo = '<table class="tab-grafico"><thead><tr><th>Ano</th>'+
      series.map(function(s){ return '<th class="n">'+esc(s.label)+'</th>'; }).join('')+
      '<th class="n">Total</th></tr></thead><tbody>'+
      matriz.map(function(l){
        return '<tr><td>'+esc(l.ano)+'</td>'+
          l.partes.map(function(p){ return '<td class="n">'+p.n+'</td>'; }).join('')+
          '<td class="n">'+l.total+'</td></tr>';
      }).join('')+'</tbody></table>';
  }else{
    corpo = '<div class="colunas">'+matriz.map(function(l){
      var segs = l.partes.filter(function(p){ return p.n > 0; }).map(function(p){
        return '<span style="flex:'+p.n+';background:'+p.s.cor+'"></span>';
      }).join('');
      return '<div class="coluna"><span class="cap">'+(l.total || '')+'</span>'+
        '<span class="pilha" style="height:'+(l.total/max*100)+'%">'+segs+'</span>'+
        '<span class="ano">'+esc(l.ano)+'</span></div>';
    }).join('')+'</div>';
  }
  return '<figure class="grafico largo"><figcaption><h3>'+esc(titulo)+'</h3>'+
    '<p class="leg">'+esc(legendaTxt)+'</p></figcaption>'+legenda+corpo+'</figure>';
}

function tabelaAudiencias(){
  var aps = INSTR.filter(function(i){ return i.tipo === 'ap'; });
  var linhas = aps.map(function(i){
    var reg = (i.espectadores != null || i.oral != null);
    return '<tr><td><strong>'+esc(i.nome)+'</strong><br>'+
      '<span style="color:#6B7280;font-size:12px">'+esc(i.ementa)+'</span></td>'+
      '<td class="n">'+(reg ? num(i.oral) : '<span style="color:#9CA3AF">sem registro</span>')+'</td>'+
      '<td class="n">'+(reg ? num(i.espectadores) : '<span style="color:#9CA3AF">sem registro</span>')+'</td></tr>';
  }).join('');
  return '<figure class="grafico largo"><figcaption><h3>Audiências públicas: participação</h3>'+
    '<p class="leg">Participações orais e espectadores registrados nas transmissões — duas grandezas diferentes, '+
    'apresentadas lado a lado em vez de num mesmo eixo. '+T.apComRegistro+' das '+aps.length+
    ' audiências têm esse registro na planilha.</p></figcaption>'+
    '<table class="tab-grafico"><thead><tr><th>Audiência</th><th class="n">Participação oral</th>'+
    '<th class="n">Espectadores</th></tr></thead><tbody>'+linhas+'</tbody></table></figure>';
}

function paginaPainel(){
  var tiles = '<div class="tiles">'+

      '<p class="sub">regulamentos, guias, agenda regulatória e outras</p></div>'+
    '<div class="tile"><p class="rot">Contribuições</p><p class="num">'+num(T.contribuicoes)+'</p>'+
      '<p class="sub">em '+T.cpComContrib+' consultas públicas</p></div>'+
    '<div class="tile"><p class="rot">Contribuintes</p><p class="num">'+num(T.contribuintes)+'</p>'+

    '<div class="tile"><p class="rot">Espectadores</p><p class="num">'+num(T.espectadores)+'</p>'+
      '<p class="sub">e '+num(T.oral)+' participações orais em '+T.apComRegistro+' audiências</p></div>'+
    '<div class="tile"><p class="rot">Links diretos</p><p class="num">'+num(T.links)+'</p>'+
      '<p class="sub">'+num(T.linksSei)+' abrem o processo no SEI; os demais, o documento</p></div>'+
  '</div>';

  /* --- participação --- */
  var porTipo = TIPOS.map(function(t){
    return {k:t.label, n:INSTR.filter(function(i){ return i.tipo === t.id; }).length, cor:t.cor};
  });
  var contribCP = INSTR.filter(function(i){ return i.contribuicoes != null; })
    .map(function(i){ return {k:i.nome, n:i.contribuicoes}; }).sort(function(a,b){ return b.n-a.n; });
  var contribTS = INSTR.filter(function(i){ return i.contribuintes != null; })
    .map(function(i){ return {k:i.nome, n:i.contribuintes}; }).sort(function(a,b){ return b.n-a.n; });
  var plats = {};
  INSTR.forEach(function(i){ var k = i.plataforma || 'Não informada'; plats[k] = (plats[k]||0)+1; });
  var porPlataforma = Object.keys(plats).map(function(k){ return {k:k, n:plats[k]}; })
    .sort(function(a,b){ return b.n-a.n; });

  /* --- publicações --- */
  var porSecao = SECOES.map(function(s){
    return {k:s.label, n:PUBS.filter(function(p){ return p.secao === s.id; }).length, cor:s.cor};
  });
  var cats = {};
  PUBS.forEach(function(p){ var k = p.categoria || 'Não informada'; cats[k] = (cats[k]||0)+1; });
  var porCategoria = Object.keys(cats).map(function(k){ return {k:k, n:cats[k]}; })
    .sort(function(a,b){ return b.n-a.n; });
  var instrs = {};
  PUBS.forEach(function(p){ p.docs.forEach(function(d){ instrs[d.cat] = (instrs[d.cat]||0)+1; }); });
  var porInstrumento = Object.keys(instrs).map(function(k){ return {k:k, n:instrs[k]}; })
    .sort(function(a,b){ return b.n-a.n; });

  var anosTodos = DADOS.anosInstr.concat(DADOS.anosPub)
    .filter(function(v,i,a){ return a.indexOf(v) === i; }).sort();
  var faixa = [];
  if(anosTodos.length){
    for(var y = parseInt(anosTodos[0],10); y <= parseInt(anosTodos[anosTodos.length-1],10); y++){
      faixa.push(String(y));
    }
  }

  var g1 = '<div class="graficos">'+
    grafPorAno('Instrumentos de participação por ano',
      'Quantos processos de escuta a ANPD abriu em cada ano, por tipo. O ano corrente ainda está em curso.',
      faixa, TIPOS, function(a, id){
        return INSTR.filter(function(i){ return i.ano === a && i.tipo === id; }).length;
      })+
    grafBarras('Instrumentos por tipo', 'Como os '+T.instrumentos+' processos se dividem.',
      porTipo, T.instrumentos, {colunaRotulo:'Tipo'})+
    grafBarras('Plataforma de participação', 'Onde a sociedade enviou suas contribuições.',
      porPlataforma, T.instrumentos, {colunaRotulo:'Plataforma'})+
    grafBarras('Contribuições por consulta pública',
      'Contribuições recebidas em cada consulta pública, da maior para a menor.',
      contribCP, T.contribuicoes, {largo:true, colunaRotulo:'Consulta pública', colunaValor:'Contribuições'})+
    grafBarras('Contribuintes por tomada de subsídios',
      'Grandeza diferente da anterior: aqui conta-se quem contribuiu, não quantas contribuições chegaram.',
      contribTS, T.contribuintes, {largo:true, cor:'#E5007D', colunaRotulo:'Tomada de subsídios', colunaValor:'Contribuintes'})+
    tabelaAudiencias()+
  '</div>';

  var g2 = '<div class="graficos">'+
    grafPorAno('Publicações por ano',
      'Ano de publicação ou de revisão de cada peça, por seção do inventário.',
      faixa, SECOES, function(a, id){
        return PUBS.filter(function(p){ return p.anoNum === a && p.secao === id; }).length;
      })+
    grafBarras('Publicações por seção', 'Divisão das '+T.publicacoes+' peças publicadas.',
      porSecao, T.publicacoes, {colunaRotulo:'Seção'})+
    grafBarras('Categoria temática', 'Assunto declarado de cada publicação.',
      porCategoria, T.publicacoes, {colunaRotulo:'Categoria'})+
    grafBarras('Instrumentos publicados', 'Tipo de peça disponibilizada em cada publicação.',
      porInstrumento, T.docsPub, {largo:true, colunaRotulo:'Instrumento', colunaValor:'Documentos'})+
  '</div>';

  return '<div class="painel-head"><h1>Painel do Inventário de Dados</h1>'+
      '<p>Visão consolidada do Plano de Dados Abertos da Superintendência de Regulação: as bases de dados '+
      'declaradas, os processos pelos quais a ANPD ouve a sociedade antes de regulamentar e as peças que publica '+
      'ao final. Cada registro leva ao processo no SEI e ao documento na origem — as abas ao lado trazem a lista '+
      'completa.</p></div>'+
    tiles+
    '<div class="painel-ctrl"><label><input type="checkbox" data-graf-tabela'+
      (state.graficosTabela ? ' checked' : '')+'>Ver gráficos como tabela</label></div>'+
    '<p class="secao-titulo">Consulta à sociedade</p>'+g1+
    '<p class="secao-titulo">Publicações</p>'+g2;
}

      '<button type="button" data-pubview="cards" aria-pressed="'+(state.pubView === 'cards')+'" title="Cards" aria-label="Visualização em cards">'+icone('grade',18)+'</button>'+
      '<button type="button" data-pubview="tabela" aria-pressed="'+(state.pubView === 'tabela')+'" title="Tabela" aria-label="Visualização em tabela">'+icone('lista',18)+'</button>'+
    '</div></div>';

  var resumo = '<div class="resumo"><p>'+
    (lista.length === PUBS.length
      ? '<strong>'+PUBS.length+'</strong> publicações'
      : '<strong>'+lista.length+'</strong> de '+PUBS.length+' publicações')+
    '</p><div class="dir"><button type="button" class="btn-csv" data-csv="pub">'+icone('baixar',13)+
    'Baixar CSV</button><span class="data">'+esc(DADOS.atualizacao)+'</span></div></div>';

  var corpo;
  if(!lista.length){
    corpo = '<p class="vazio-lista">Nenhuma publicação encontrada com os filtros selecionados.</p>';
  }else if(state.pubView === 'cards'){
    corpo = '<div class="grade">'+lista.map(function(p){
      var s = acha(SECOES, p.secao) || {label:'', cor:'#6B7280'};
      return '<article class="card" style="border-top-color:'+s.cor+'">'+
        '<div class="tipo" style="color:'+s.cor+'">'+icone('livro',13)+esc(s.label)+'</div>'+
        '<h3>'+esc(p.titulo)+'</h3>'+
        '<p class="ementa">'+esc(p.ementa)+'</p>'+
        '<dl>'+
          (p.categoria ? '<dt>Categoria</dt><dd>'+esc(p.categoria)+'</dd>' : '')+
          (p.ano ? '<dt>Ano</dt><dd>'+esc(p.ano)+'</dd>' : '')+
          (p.vigencia ? '<dt>Vigência</dt><dd>'+esc(p.vigencia)+'</dd>' : '')+
          (p.parceria ? '<dt>Coordenação-Geral / Parceria</dt><dd>'+esc(p.parceria)+'</dd>' : '')+
          (p.sei ? '<dt>Processo</dt><dd>'+linkSei(p.sei, p.seiUrl)+'</dd>' : '')+
        '</dl>'+
        '<div class="docs">'+botaoSei(p.sei, p.seiUrl)+listaDocs(p.docs)+'</div>'+
      '</article>';
    }).join('')+'</div>';
  }else{
    corpo = '<div class="tabela-wrap"><table class="catalogo"><thead><tr>'+
      '<th style="width:34%">Publicação</th><th style="width:14%">Categoria</th>'+
      '<th style="width:8%">Ano</th><th style="width:18%">Vigência</th>'+
      '<th style="width:12%">Processo</th><th>Documentos</th></tr></thead><tbody>'+
      lista.map(function(p){
        var s = acha(SECOES, p.secao) || {label:'', cor:'#6B7280'};
        return '<tr>'+
          '<td><span class="badge" style="background:'+s.cor+'18;color:'+s.cor+'">'+esc(s.label)+'</span>'+
            '<p class="t1" style="margin-top:6px">'+esc(p.titulo)+'</p><p class="t2">'+esc(p.ementa)+'</p></td>'+
          '<td>'+esc(p.categoria || '—')+'</td>'+
          '<td>'+esc(p.ano || '—')+'</td>'+
          '<td>'+esc(p.vigencia || '—')+'</td>'+
          '<td>'+(p.sei ? linkSei(p.sei, p.seiUrl) : '—')+'</td>'+
          '<td><div class="docs" style="margin:0">'+listaDocs(p.docs)+'</div></td>'+
        '</tr>';
      }).join('')+'</tbody></table></div>';
  }

  return cabeca + tabs + filtros + resumo + corpo;
}

/* ===========================================================
   9. ABA BASES DE DADOS
   =========================================================== */

function paginaBases(){
  var cards = BASES.map(function(b){
    var attrs = b.atributos.map(function(a){
      var v = semAcento(a.v);
      var cls = v === 'sim' ? ' class="sim"' : (v === 'nao' ? ' class="nao"' : '');
      return '<div><dt>'+esc(a.k)+'</dt><dd'+cls+'>'+esc(a.v)+'</dd></div>';
    }).join('');
    return '<article class="base">'+
      '<h3>'+esc(b.descricao)+'</h3>'+
      '<dl class="atributos">'+attrs+'</dl>'+
      '<div class="docs">'+(b.link
        ? '<a class="doc" href="'+esc(b.link)+'" target="_blank" rel="noopener noreferrer">'+
          icone('link',12)+'Acessar a base publicada</a>'
        : '<span class="doc sem">Sem link na planilha</span>')+'</div>'+
    '</article>';
  }).join('');

  return '<div class="page-head"><div><h1>Bases de Dados</h1>'+
    '<p>Conjuntos de dados declarados no Plano de Dados Abertos da Superintendência de Regulação, com a situação '+
    'de abertura, a periodicidade de atualização e o endereço onde cada base está publicada.</p></div></div>'+
    '<div class="resumo"><p><strong>'+BASES.length+'</strong> bases no inventário</p>'+
    '<div class="dir"><span class="data">'+esc(DADOS.atualizacao)+'</span></div></div>'+
    '<div class="bases">'+cards+'</div>';
}

/* ===========================================================
   10. EXPORTAÇÃO
   =========================================================== */

function baixaCSV(nome, cab, linhas){
  var csv = [cab].concat(linhas).map(function(l){
    return l.map(function(v){ return '"'+String(v == null ? '' : v).replace(/"/g,'""')+'"'; }).join(';');
  }).join('\r\n');
  var blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function csvInstrumentos(){
  var lista = INSTR.filter(function(i){ return passaInstr(i); });
  baixaCSV('anpd-consulta-a-sociedade.csv',
    ['Tipo','Instrumento','Ementa','Nº SEI','Link do processo no SEI','Período','Ano','Plataforma',
     'Parceria','Contribuições','Contribuintes','Participação oral','Espectadores','Documentos'],
    lista.map(function(i){
      var t = acha(TIPOS, i.tipo) || {singular:''};
      return [t.singular, i.nome, i.ementa, i.sei, i.seiUrl, i.periodo, i.ano, i.plataforma, i.parceria,
              i.contribuicoes == null ? '' : i.contribuicoes,
              i.contribuintes == null ? '' : i.contribuintes,
              i.oral == null ? '' : i.oral,
              i.espectadores == null ? '' : i.espectadores,
              i.docs.map(function(d){ return d.cat+': '+(d.url || d.ref || 'sem link'); }).join(' | ')];
    }));
}

function csvPublicacoes(){
  var lista = PUBS.filter(function(p){ return passaPub(p); });
  baixaCSV('anpd-publicacoes.csv',
    ['Seção','Título','Categoria temática','Nº SEI','Link do processo no SEI','Ano','Vigência',
     'Ementa','Coordenação-Geral / Parceria','Documentos'],
    lista.map(function(p){
      var s = acha(SECOES, p.secao) || {label:''};
      return [s.label, p.titulo, p.categoria, p.sei, p.seiUrl, p.ano, p.vigencia, p.ementa, p.parceria,
              p.docs.map(function(d){ return d.cat+': '+(d.url || d.ref || 'sem link'); }).join(' | ')];
    }));
}

/* ===========================================================
   11. RENDERIZAÇÃO E EVENTOS
   =========================================================== */

var app = document.getElementById('app');
var TITULOS = {
  painel:'Painel do Inventário de Dados',
  consulta:'Consulta à Sociedade',
  publicacoes:'Publicações',
  bases:'Bases de Dados'
};

function render(){
  var focoId = document.activeElement && document.activeElement.id;
  var caret = null;
  if(focoId && document.activeElement.selectionStart != null){
    caret = document.activeElement.selectionStart;
  }

  var miolo = state.page === 'consulta' ? paginaConsulta()
            : state.page === 'publicacoes' ? paginaPublicacoes()
            : state.page === 'bases' ? paginaBases()
            : paginaPainel();

  app.innerHTML = topBar() + cabecalho() + subNav() + trilha(TITULOS[state.page]) + miolo + rodape();

  if(focoId){
    var alvo = document.getElementById(focoId);
    if(alvo){
      alvo.focus();
      if(caret != null && alvo.setSelectionRange){
        try{ alvo.setSelectionRange(caret, caret); }catch(err){}
      }
    }
  }
}

function alterna(chave, valor){
  var i = state[chave].indexOf(valor);
  if(i === -1) state[chave].push(valor); else state[chave].splice(i,1);
}

app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-nav],[data-view],[data-pubview],[data-tipo],[data-secao],[data-toggle],[data-limpar],[data-csv]');
  if(!el || el.tagName === 'INPUT' || el.tagName === 'A') return;
  if(el.dataset.nav){ state.page = el.dataset.nav; window.scrollTo(0,0); return render(); }
  if(el.dataset.csv){ return el.dataset.csv === 'pub' ? csvPublicacoes() : csvInstrumentos(); }
  if(el.dataset.limpar){
    if(el.dataset.limpar === 'pub'){ state.pubBusca=''; state.pubAnos=[]; state.pubCategorias=[]; }
    else { state.busca=''; state.anos=[]; state.plataformas=[]; }
    return render();
  }
  if(el.dataset.view){ state.view = el.dataset.view; return render(); }
  if(el.dataset.pubview){ state.pubView = el.dataset.pubview; return render(); }
  if(el.dataset.tipo){ state.tipo = el.dataset.tipo; return render(); }
  if(el.dataset.secao){ state.secao = el.dataset.secao; return render(); }
  if(el.dataset.toggle){ alterna(el.dataset.toggle, el.dataset.valor); return render(); }
});

app.addEventListener('input', function(ev){
  if(ev.target.id === 'busca-instr'){ state.busca = ev.target.value; render(); }
  else if(ev.target.id === 'busca-pub'){ state.pubBusca = ev.target.value; render(); }
});

app.addEventListener('change', function(ev){
  if(ev.target.hasAttribute && ev.target.hasAttribute('data-graf-tabela')){
    state.graficosTabela = ev.target.checked; render();
  }
});

if(/[?&]embed=1/.test(location.search) || location.hash === '#embed'){
  document.body.classList.add('embed');
}

// Dentro de um iframe, a propria pagina estica o quadro ate a altura do
// conteudo. O ajuste costuma ser feito por script na pagina que CONTEM o
// iframe, mas o editor do Plone remove scripts -- entao ele e feito aqui,
// de dentro, onde o script sobrevive.
//
// LIMITE: so funciona se o iframe e a pagina que o contem estiverem na
// mesma origem. Hospedando a pagina fora do dominio do portal (GitHub
// Pages, por exemplo), window.frameElement e bloqueado pelo navegador e
// este trecho desiste em silencio -- ai o iframe precisa de altura fixa
// no atributo height.
(function(){
  if(window === window.top) return;
  var quadro;
  try { quadro = window.frameElement; } catch(e) { return; }
  if(!quadro) return;
  var ultima = 0, passos = 0;
  function medida(){
    return Math.max(document.documentElement.scrollHeight,
                    document.body.scrollHeight,
                    document.body.offsetHeight);
  }
  function ajusta(){
    // Esticar o quadro muda a altura disponivel e o conteudo reflui, o que
    // muda a medida de novo. Uma medicao so para curta. Entao cada mudanca
    // agenda nova medicao e o processo encerra quando a altura estabiliza.
    // A folga de 8px evita oscilar por arredondamento; o teto de 40 passos
    // garante que isto nao vira laco infinito num layout mal comportado.
    var h = medida();
    if(Math.abs(h - ultima) > 8){
      ultima = h;
      quadro.style.height = (h + 4) + 'px';
      if(passos++ < 40) setTimeout(ajusta, 120);
    }
  }
  function remede(){ passos = 0; ajusta(); }
  remede();
  // Passagens tardias incondicionais: partes da pagina (graficos) so ganham
  // altura depois, e nem toda mudanca dispara o observador.
  [300, 800, 1500, 3000].forEach(function(ms){ setTimeout(remede, ms); });
  window.addEventListener('resize', remede);
  window.addEventListener('load', remede);
  // Troca de aba e uso dos filtros mudam muito a altura: segue observando.
  if(window.ResizeObserver){
    var obs = new ResizeObserver(remede);
    obs.observe(document.body);
    obs.observe(document.documentElement);
  }
})();

render();
})();
</script>
